<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height:100vh; color:white; }
        .navbar { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); }
        .container-box { margin-top: 80px; }
        .card { background: rgba(255,255,255,0.05); border:none; border-radius:20px; backdrop-filter: blur(15px); color:white; transition:0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow:0 10px 30px rgba(0,0,0,0.4); }
        .btn-custom { border-radius:30px; padding:10px 25px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="#">🚀 MyApp</a>
    <div class="ms-auto">
        {% if user %}
            <span class="me-3"><i class="bi bi-person-circle"></i> {{ user.email }}</span>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        {% endif %}
    </div>
</nav>

<div class="container container-box text-center">
    {% if user %}
        <h1 class="mb-4">Benvenuto 👋</h1>
        <h3>I tuoi punteggi:</h3>
        <ul>
        {% for s in user_scores %}
            <li>{{ s.timestamp }} → {{ s.score }}</li>
        {% endfor %}
        </ul>
        <a href="/start-ws" class="btn btn-success btn-lg btn-custom mt-3">Avvia WebSocket</a>
    {% else %}
        <h1 class="mb-4">Benvenuto 👋</h1>
        <p class="mb-4">Effettua il login per continuare</p>
        <a href="/sso/login" class="btn btn-primary btn-lg btn-custom">Fai il login</a>
    {% endif %}
</div>

</body>
</html>
